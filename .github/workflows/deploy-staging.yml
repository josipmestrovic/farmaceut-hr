name: Staging - ručni deployment

on:
  workflow_dispatch:
    inputs:
      nacin:
        description: "Način pokretanja"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - deploy
      commit_sha:
        description: "Puni SHA commita (40 znakova); prazno = aktualni main"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: farmaceut-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Sinkronizacija teme i plugina na staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi povijest repozitorija
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Odaberi i provjeri verziju za deployment
        id: verzija
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SHA="$MAIN_SHA"
          if [[ -n "$REQUESTED_SHA" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Unesi puni SHA commita od 40 heksadekadskih znakova."
              exit 1
            fi
            SHA="$REQUESTED_SHA"
          fi

          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "Traženi commit ne postoji."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$SHA" "$MAIN_SHA"; then
            echo "Commit mora biti dio povijesti grane main."
            exit 1
          fi

          git checkout --detach "$SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Odabrani commit: $(git rev-parse HEAD)"
          git log -1 --format='Opis: %s'

      - name: Pripremi SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sinkroniziraj temu i plugin farmaceut-cjenik
        env:
          MODE: ${{ inputs.nacin }}
          HOST: ${{ vars.STAGING_HOST }}
          USERNAME: ${{ vars.STAGING_USER }}
          PORT: ${{ vars.STAGING_PORT }}
          TARGET: ${{ vars.STAGING_PATH }}
        run: |
          set -euo pipefail

          EXPECTED="/home/u1624-l711kuy5f9ig/www/staging.farmaceut.hr/public_html"
          THEME="wp-content/themes/farmaceut"
          PLUGIN="wp-content/plugins/farmaceut-cjenik"
          REMOTE_THEME="$TARGET/$THEME"
          REMOTE_PLUGIN="$TARGET/$PLUGIN"

          if [[ "$TARGET" != "$EXPECTED" ]]; then
            echo "Zaštita: staging putanja nije očekivana."
            exit 1
          fi

          if [[ ! -f "$THEME/style.css" || ! -f "$THEME/index.php" ]]; then
            echo "Zaštita: nedostaju osnovne datoteke teme u odabranom commitu."
            exit 1
          fi

          if [[ ! -f "$PLUGIN/farmaceut-cjenik.php" ]]; then
            echo "Zaštita: nedostaje plugin farmaceut-cjenik u odabranom commitu."
            exit 1
          fi

          SSH=(ssh
            -i "$HOME/.ssh/staging_key"
            -p "$PORT"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )

          if ! "${SSH[@]}" "$USERNAME@$HOST" \
            "test -f '$TARGET/wp-config.php' && test -d '$REMOTE_THEME' && test ! -L '$REMOTE_THEME'"; then
            echo "Zaštita: staging WordPress ili direktorij teme nisu pronađeni."
            exit 1
          fi

          "${SSH[@]}" "$USERNAME@$HOST" "mkdir -p '$REMOTE_PLUGIN'"

          ARGS=(-avz --itemize-changes --no-perms --no-owner --no-group --delete-delay)

          if [[ "$MODE" == "dry-run" ]]; then
            ARGS+=(--dry-run)
            echo "DRY RUN: prikaz prijenosa i brisanja, bez promjena."
          elif [[ "$MODE" == "deploy" ]]; then
            echo "DEPLOY: sinkronizacija teme i plugina, uključujući uklonjene datoteke."
          else
            echo "Nepoznat način rada."
            exit 1
          fi

          echo "Verzija koda: $(git rev-parse HEAD)"
          RSYNC_E="ssh -i $HOME/.ssh/staging_key -p $PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"

          rsync "${ARGS[@]}" -e "$RSYNC_E" "$THEME/" "$USERNAME@$HOST:$REMOTE_THEME/"
          rsync "${ARGS[@]}" -e "$RSYNC_E" "$PLUGIN/" "$USERNAME@$HOST:$REMOTE_PLUGIN/"
